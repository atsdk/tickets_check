name: fare-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # ~every 30 min (GitHub cron is best-effort)
  workflow_dispatch:          # manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: fare-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional email (leave secrets unset to disable):
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commit price history
        run: |
          git config user.name "fare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json prices.csv
          git diff --cached --quiet || git commit -m "price data $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
